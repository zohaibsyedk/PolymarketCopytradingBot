[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polycopy"
version = "1.0.0"
description = "PolyCopy: a self-hosted Polymarket copy-trading server with a web terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polymarket-client==0.12.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13,<16",
    "pydantic>=2.6",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
build = ["pyinstaller>=6.6"]

[project.scripts]
polycopy = "polycopy.__main__:main"
polycopy-backtest = "polycopy.backtest:main"

[tool.setuptools.packages.find]
include = ["polycopy*"]

[tool.setuptools.package-data]
polycopy = ["web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
